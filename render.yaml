databases:
  - name: skybooker-db
    databaseName: flight_booking
    user: skybooker
    plan: free

services:
  - type: web
    name: skybooker-flight-booking
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skybooker-db
          property: connectionString

